@keyframes sprIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}10%{transform:translate(-50%,-50%) scale(1.25) rotate(8deg);opacity:1}20%{transform:translate(-50%,-50%) scale(1) rotate(0)}38%{transform:translate(-50%,-68%)}52%{transform:translate(-50%,-50%)}68%{transform:translate(-50%,-68%)}82%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(-50%,-50%) scale(.6);opacity:0}}
#snd{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:clamp(250px,34vw,400px);box-sizing:border-box;padding:10px 14px;text-align:center;background:#e0264a;color:#fff;border:3px solid #fff;border-radius:16px;box-shadow:0 5px 0 #8a1f3d,0 0 0 3px #e0264a;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;animation:sndp 1s steps(1,end) infinite}

<body>
<canvas id="c"></canvas>
<div id="snd"><div class="s1"><svg viewBox="0 0 10 8" shape-rendering="crispEdges" fill="#fff" width="30" height="24"><rect x="0" y="3" width="2" height="2"/><rect x="2" y="2" width="1" height="4"/><rect x="3" y="1" width="1" height="6"/><rect x="4" y="0" width="1" height="8"/><rect x="6" y="2" width="1" height="1"/><rect x="7" y="3" width="1" height="2"/><rect x="6" y="5" width="1" height="1"/><rect x="8" y="1" width="1" height="1"/><rect x="9" y="2" width="1" height="4"/><rect x="8" y="6" width="1" height="1"/></svg>ВКЛЮЧИ ЗВУК!!!</div><div class="s2">ОБЯЗАТЕЛЬНО! Включи громкость, а на iPhone выключи беззвучный режим.<br>Кнопка «Звук» справа сверху</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const NAMES=['Собери пазл','Лови подарки','Катин мир','Ритм','Задуй свечи'];
const ST='katya-bday-progress';
let done=0; // сколько уровней пройдено
try{done=Math.min(5,+localStorage.getItem(ST)||0)}catch(e){}
const save=()=>{try{localStorage.setItem(ST,done)}catch(e){}};

/* ---- звук ---- */
let ac=null,muted=false;
/* голос и музыка идут через Web Audio: так Safari на iPhone их не блокирует */
function getAC(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac}catch(e){return null}}
let voxGain=null,musGain=null,voxSrc=null,musSrc=null,voxId=0,musId=0,musFade=false;const BUF={};
function gains(){const a=getAC();if(!a)return false;if(!voxGain){voxGain=a.createGain();voxGain.connect(a.destination);musGain=a.createGain();musGain.connect(a.destination)}return true}
function syncAudio(){if(voxGain)voxGain.gain.value=muted?0:1;if(musGain&&!musFade)musGain.gain.value=muted?0:1}
function loadBuf(url){
  if(BUF[url])return BUF[url];
  const a=getAC();if(!a)return Promise.reject(new Error('no audio'));
  return BUF[url]=fetch(url).then(r=>{if(!r.ok)throw new Error('404');return r.arrayBuffer()}).then(ab=>new Promise((res,rej)=>{const p=a.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej)})).catch(e=>{delete BUF[url];throw e});
}
function preload(list){list.forEach(u=>{try{loadBuf(u).catch(()=>{})}catch(e){}})}
function unlockAudio(){
  const a=getAC();if(!a)return;
  try{if(a.state!=='running')a.resume();const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}
}
['pointerdown','touchend','mousedown','keydown','click'].forEach(e=>addEventListener(e,unlockAudio,{capture:true,passive:true}));
function playVox(src,onend,onerr){
  stopVox();const id=++voxId;if(!gains()){onerr&&onerr();return}
  loadBuf(src).then(buf=>{
    if(id!==voxId)return;try{ac.resume&&ac.resume()}catch(e){}
    const s=ac.createBufferSource();s.buffer=buf;s.connect(voxGain);voxSrc=s;syncAudio();
    s.onended=()=>{if(id===voxId&&voxSrc===s){voxSrc=null;onend&&onend()}};s.start(0);
  }).catch(()=>{if(id===voxId&&onerr)onerr()});
}
function stopVox(){voxId++;if(voxSrc){try{voxSrc.onended=null;voxSrc.stop()}catch(e){}voxSrc=null}}
function playMus(src){
  stopMus();const id=++musId;if(!gains())return;
  loadBuf(src).then(buf=>{
    if(id!==musId)return;try{ac.resume&&ac.resume()}catch(e){}
    const s=ac.createBufferSource();s.buffer=buf;s.connect(musGain);musSrc=s;musFade=false;
    try{musGain.gain.cancelScheduledValues(0)}catch(e){}musGain.gain.value=muted?0:1;s.start(0);
  }).catch(()=>{});
}
function fadeMus(sec){

        cf._p=Array.from({length:160},(_,i)=>({x:Math.random()*W,y:-Math.random()*H*.7,v:90+Math.random()*200,w:3+Math.random()*6,c:['#ff8fb0','#ffd54f','#7fd88f','#7ac8ff','#fff','#e0264a'][i%6],s:Math.random()*6}));
        [523,659,784,1047,1319].forEach((q,i)=>TL(()=>beep(q,.4,'sine',.04),i*130));
      },1300);
      TL(()=>{const q=st.querySelector('#l5s');if(q){q.textContent='Подожди, это ещё не всё...';q.classList.add('on')}},4200);TL(()=>{if(!dead)finish()},8000);
    }
    /* цикл */
    let last=performance.now()/1e3;
    function loop(){
      raf=requestAnimationFrame(loop);if(dead)return;const n=performance.now()/1e3,dt=Math.min(.05,n-last);last=n;
      syncAudio();presses=presses.filter(x=>n-x<1);amp+=(Math.min(1,presses.length/7)-amp)*Math.min(1,dt*8);
      if(state=='play'&&tStart){const rem=30-(n-tStart);hI.style.width=Math.max(0,rem/30*100)+'%';hA.textContent='Осталось '+Math.max(0,Math.ceil(rem))+' с';if(rem<=0)out()}
      const to=state=='out'?n-tOut:0,L=state=='out'?(to<1.2?.55:Math.min(1,.55+(to-1.2)*.8)):1;
      hemi.intensity=.85*L;sun.intensity=1.0*L;phMat.color.setScalar(.45+.55*L);
      if(!drag)G.rotation.y+=dt*.12;
      gust*=Math.exp(-dt*4.5);const blow=state=='play'?Math.min(1,amp*1.3+gust*.55):0;
      const th=G.rotation.y,ax=new THREE.Vector3(Math.sin(th),0,-Math.cos(th)).normalize();
      if(state=='play'&&tStart){const k=Math.round(blow*10);hB.textContent='Сила ['+'#'.repeat(k)+'.'.repeat(10-k)+']'}
      let fi=0;
      flames.forEach(f=>{if(!f.g.visible)return;
        const fk=Math.sin(n*14+f.ph)*.5+Math.sin(n*23+f.ph*2)*.5,al=.1+1.15*blow+fk*(.08+.4*blow);
        f.g.quaternion.setFromAxisAngle(ax,al);
        f.g.scale.set(1-.5*blow,1+.12*fk-.72*blow,1-.5*blow);
        f.sp.scale.setScalar(.9*(1+.12*fk)*(1-.65*blow));f.sp.material.opacity=Math.max(.2,.85*(1-.45*blow)+.1*fk);fi+=1+.2*fk-.6*blow});
      fl.intensity=state=='out'?0:1.2*Math.max(0,fi/19);
      smokes.forEach(m=>{const a=n-tOut-m.p*.02;m.s.position.y+=dt*.8;m.s.position.x+=Math.sin(n*2+m.p)*dt*.1+m.x*dt*.3;m.s.scale.setScalar(.25+a*.5);m.s.material.opacity=Math.max(0,.8-a*.35)});
      if(cf){const c=cf.getContext('2d');c.clearRect(0,0,W,H);cf._p.forEach(p=>{p.y+=p.v*dt;p.x+=Math.sin(p.y*.02+p.s)*30*dt;if(p.y>H)p.y=-10;c.fillStyle=p.c;c.fillRect(p.x,p.y,p.w,p.w*.6)})}
      R.render(scene,cam);
    }
    raf=requestAnimationFrame(loop);
  }
  function stop(){dead=true;clearInterval(fadeIv);stopMus();mus=null;cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];if(kd)removeEventListener('keydown',kd);kd=null;cf=null;if(R){R.dispose();R=null}stage.style.background='';stage.innerHTML=''}
  return{start,stop};
})();
/* ---- вход в уровень и выход ---- */
const ov=document.getElementById('lvl');
function openLevel(i){
  document.documentElement.classList.add('inlvl');
  zi=i;zdir=1;hover=-1;tgtY=tgtX=0;
  document.getElementById('lt').textContent='L'+(i+1)+': '+NAMES[i];
  document.getElementById('win').style.display=i<done?'none':'';
  document.getElementById('hint').style.display=LEVELS[i]&&LEVELS[i].hint?'':'none';
}
function closeLevel(){if(LEVELS[zi])LEVELS[zi].stop();ov.classList.remove('on');inLevel=false;zdir=-1}
document.getElementById('exit').onclick=()=>{beep(440,.1);closeLevel()};
let pend=false,scrollId=0;
function unlockFinal(sc){
  document.documentElement.classList.add('unlocked');
  const my=++scrollId;
  if(sc)setTimeout(()=>{
    if(my!==scrollId)return;
    const y0=scrollY,y1=innerHeight,D=4200,t0=performance.now();let stop=false;
    const cancel=()=>{stop=true};['wheel','touchstart','keydown'].forEach(e=>addEventListener(e,cancel,{once:true,passive:true}));
    (function f(n){if(stop||my!==scrollId)return;const k=Math.min(1,(n-t0)/D),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;scrollTo(0,y0+(y1-y0)*e);if(k<1)requestAnimationFrame(f)})(t0);
  },900);
}
function finish(){
  if(zi==done){done++;save()}if(done>=5){if(zi==4)pend=true;else unlockFinal(false)}paintKeys();beep(523,.1);beep(659,.1);beep(784,.2);closeLevel();
}
document.getElementById('win').onclick=finish;
document.getElementById('hint').onclick=()=>{if(LEVELS[zi]&&LEVELS[zi].hint)LEVELS[zi].hint()};
const rb=document.getElementById('reset');let rt=0;
rb.onclick=()=>{
  if(!rt){rb.textContent='Точно?';rt=setTimeout(()=>{rt=0;rb.textContent='Сброс'},3000);return}
  clearTimeout(rt);rt=0;rb.textContent='Сброс';
  done=0;save();paintKeys();if(inLevel)closeLevel();say('Прогресс сброшен');pend=false;scrollId++;document.documentElement.classList.remove('unlocked');scrollTo(0,0);try{const v=document.getElementById('vid');v.pause();v.currentTime=0;v.controls=false;document.getElementById('play').style.display=''}catch(e){}beep(300,.15,'triangle');
};
addEventListener('keydown',e=>{if(e.key=='Escape'&&inLevel)closeLevel()});

/* ---- цикл ---- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1e3);last=now;const t=now/1e3;
  if(mode=='boot'){bootT+=dt;if(bootT>2){mode='idle';beep(784,.12)}}
  if(zdir){zoom=THREE.MathUtils.clamp(zoom+zdir*dt/.9,0,1);
    if(zoom>=1&&zdir>0){zdir=0;inLevel=true;ov.classList.add('on');lpEl.style.display=LEVELS[zi]?'none':'';if(LEVELS[zi])LEVELS[zi].start(stage)}
    if(zoom<=0&&zdir<0){zdir=0;document.documentElement.classList.remove('inlvl');if(pend){pend=false;unlockFinal(true)}}}
  const e=ease(zoom);
  cam.position.set(0,.85*e,homeZ+(scrZ-homeZ)*e);cam.lookAt(0,.85*e,0);
  const k=drag?.2:.08;
  panel.rotation.y+=(tgtY*(1-e)-panel.rotation.y)*k;panel.rotation.x+=(tgtX*(1-e)-panel.rotation.x)*k;
  panel.position.y=Math.sin(t*1.2)*.04*(1-e);
  pw+=((power?1:0)-pw)*Math.min(1,dt*8);knobX+=((power?.22:-.22)-knobX)*Math.min(1,dt*14);
  const mvK=(power?.22:-.22)-knobX;knob.position.y=knobX;knob.position.z=.08-Math.min(.03,Math.abs(mvK)*.2);knob.rotation.x=mvK*1.2;
  kcMat.emissive.setHex(0xff2d8a);kcMat.emissiveIntensity=.45*pw;
  led.material.emissiveIntensity=pw*(.5+.5*Math.abs(Math.sin(t*2)));
  keys.forEach((kk,i)=>{
    kk.press*=.85;kk.shake*=.9;
    kk.g.position.z=.4-kk.press*.12+(kk.hov&&i<=done?.04:0);
    kk.g.position.x=KX(i)+Math.sin(t*50)*.04*kk.shake;
  });
  drawScreen(t);R.render(scene,cam);if(zoom===0&&hintFrame++%20===0)placeHint();
}
/* финальный блок и прокрутка */
addEventListener('scroll',()=>{cv.style.transform='translateY('+(-scrollY)+'px)';document.body.classList.toggle('scrolled',scrollY>30)},{passive:true});
function setArrow(el,d){
  const m=['.......X...','.......XX..','XXXXXXXXXX.','XXXXXXXXXXX','XXXXXXXXXX.','.......XX..','.......X...'],k=el.parentNode.id=='hintL'?1.25:1;let r='';
  m.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!='X')return;const px=d=='r'?x:d=='u'?y:6-y,py=d=='r'?y:d=='u'?10-x:x;r+='<rect x="'+px+'" y="'+py+'" width="1" height="1"/>'}));
  const h=d=='r';el.dataset.d=d;
  el.innerHTML='<svg viewBox="0 0 '+(h?'11 7':'7 11')+'" shape-rendering="crispEdges" fill="#e0264a" width="'+Math.round((h?55:35)*k)+'" height="'+Math.round((h?35:55)*k)+'">'+r+'</svg>';
}
document.querySelectorAll('.pa').forEach(el=>setArrow(el,el.dataset.d));
let hintFrame=0;
function placeHint(){
  const hl=document.getElementById('hintL'),pa=hl.querySelector('.pa');if(!hl||hl.classList.contains('gone'))return;
  const hw=hl.offsetWidth,hh=hl.offsetHeight,v=new THREE.Vector3(-3.25,0,.3).project(cam),sx=(v.x*.5+.5)*innerWidth,sy=(-v.y*.5+.5)*innerHeight;
  if(sx>=hw+16){
    if(hl.classList.contains('v')){hl.classList.remove('v');setArrow(pa,'r')}
    hl.style.left=(sx-hw-4)+'px';hl.style.top=Math.max(8,sy-hh/2)+'px';
  }else{
    const t=new THREE.Vector3(0,-2.5,.3).project(cam),tx=(t.x*.5+.5)*innerWidth,ty=(-t.y*.5+.5)*innerHeight;
    if(!hl.classList.contains('v')){hl.classList.add('v');setArrow(pa,'u')}
    hl.style.left=Math.max(8,Math.min(innerWidth-hw-8,tx-hw/2))+'px';hl.style.top=(ty+4)+'px';
  }
}
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>setTimeout(placeHint,50));
addEventListener('resize',()=>setTimeout(placeHint,50));
if(done>=5)unlockFinal(false);
{const vid=document.getElementById('vid'),wrap=document.getElementById('vwrap'),pb=document.getElementById('play'),ft=document.getElementById('finTxt');
  const miss=()=>{ft.textContent='Видео пока не добавлено: положи файл media/greeting.mp4'};
  let expd=false;
  function fit(){if(expd)return;const vw=vid.videoWidth||16,vh=vid.videoHeight||9,k=Math.min(Math.min(innerWidth*.88,760)/vw,innerHeight*.58/vh);wrap.style.width=Math.round(vw*k)+'px';wrap.style.height=Math.round(vh*k)+'px'}
  vid.onloadedmetadata=fit;addEventListener('resize',fit);fit();
  pb.onclick=()=>{vid.muted=muted;const p=vid.play();if(p&&p.then)p.then(()=>{pb.style.display='none';vid.controls=true;ft.textContent=''}).catch(miss)};
  vid.onended=()=>{pb.style.display='';vid.controls=false};
  vid.onerror=miss;
  const vexp=document.getElementById('vexp'),sv=p=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#e0264a" stroke-width="3" stroke-linecap="square"><path d="'+p+'"/></svg>',
    IE=sv('M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6'),IC=sv('M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6'),EZ='cubic-bezier(.2,.8,.2,1)',TR='.55s '+EZ;
  let ph=null,bk=null;vexp.innerHTML=IE;
  function expand(){
    if(expd)return;const r=wrap.getBoundingClientRect();expd=true;
    ph=document.createElement('div');ph.style.cssText='width:'+r.width+'px;height:'+r.height+'px;flex:none';wrap.parentNode.insertBefore(ph,wrap);
    bk=document.createElement('div');bk.style.cssText='position:fixed;inset:0;background:rgba(20,5,15,.92);opacity:0;transition:opacity .55s;z-index:49';document.body.appendChild(bk);
    Object.assign(wrap.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:50,boxSizing:'border-box',transition:'none'});
    void wrap.offsetWidth;
    wrap.style.transition='left '+TR+',top '+TR+',width '+TR+',height '+TR+',border-radius .55s,border-width .55s';
    requestAnimationFrame(()=>{bk.style.opacity=1;Object.assign(wrap.style,{left:'0px',top:'0px',width:'100vw',height:'100vh',borderRadius:'0',borderWidth:'0'})});
    vexp.innerHTML=IC;vexp.setAttribute('aria-label','Свернуть');document.documentElement.classList.add('vexp');
  }
  function collapse(){
    if(!expd||!ph)return;const r=ph.getBoundingClientRect();bk.style.opacity=0;
    Object.assign(wrap.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:'22px',borderWidth:'6px'});
    setTimeout(()=>{wrap.removeAttribute('style');if(ph)ph.remove();if(bk)bk.remove();ph=bk=null;expd=false;vexp.innerHTML=IE;vexp.setAttribute('aria-label','Развернуть');document.documentElement.classList.remove('vexp');fit()},580);
  }
  vexp.onclick=()=>expd?collapse():expand();
  addEventListener('keydown',e=>{if(e.key=='Escape'&&expd)collapse()});
}
const start=()=>{paintKeys();requestAnimationFrame(loop)};
(document.fonts&&document.fonts.load("12px 'Press Start 2P'")||Promise.resolve()).then(start,start);
})();
